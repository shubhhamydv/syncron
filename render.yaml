services:
  # 1. Express Backend Web Service (Connected to your Neon PostgreSQL)
  - type: web
    name: syncron-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npx prisma db push --skip-generate && npm run seed && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_mZqk8NFPgbd9@ep-rapid-firefly-beqqegcp-pooler.c-9.us-east-2.aws.neon.tech/neondb?sslmode=require
      - key: CLIENT_URL
        value: "*"
      - key: ADMIN_TOKEN
        generateValue: true

  # 2. Vite + React Frontend Static Site
  - type: web
    name: syncron-client
    runtime: static
    rootDir: client
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: syncron-server
          property: host
